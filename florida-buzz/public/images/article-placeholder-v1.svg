  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1260" cy="225" r="118" fill="url(#sun)" opacity=".96"/>
  <path d="M0 570C225 510 360 630 590 573s382-38 550 21 307 29 460-4v310H0Z" fill="#f7ecd6" opacity=".96"/>
  <path d="M0 650c238-56 416 46 638 8 237-40 420-9 576 39 135 42 250 25 386-10v213H0Z" fill="#9ed0c8" opacity=".72"/>
