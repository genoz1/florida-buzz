      <stop offset="0" stop-color="#0e3b43"/>
      <stop offset="0.64" stop-color="#176b73"/>
      <stop offset="1" stop-color="#f07c5f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59b"/>
      <stop offset="1" stop-color="#ff9b74"/>
