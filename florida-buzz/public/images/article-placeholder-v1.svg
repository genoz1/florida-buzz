<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Florida Buzz article placeholder</title>
  <desc id="description">A branded abstract Florida sunrise used when no relevant story photograph is available.</desc>
  <defs>
